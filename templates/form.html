{% extends "base.html" %}
{% block content %}
<div class="page-header"><h2>{{ title }}</h2></div>
<form method="post" class="panel form-grid">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-light" href="{{ request.META.HTTP_REFERER|default:'/' }}">Cancel</a>
</form>
{% endblock %}
