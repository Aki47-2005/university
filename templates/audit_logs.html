{% extends "base.html" %}
{% block content %}
<div class="page-header"><h2>Audit Logs</h2></div>
<div class="panel"><table class="table table-hover"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>IP</th></tr></thead><tbody>{% for log in logs %}<tr><td>{{ log.timestamp }}</td><td>{{ log.user }}</td><td>{{ log.action }}</td><td>{{ log.ip_address }}</td></tr>{% empty %}<tr><td>No logs yet.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
